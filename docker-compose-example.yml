# SPDX-License-Identifier: MIT
# Copy to docker-compose.yml. Set ADMIN_PASS in your shell or an untracked
# .env file before starting; the example must never deploy with a known password.
#
# The container runs as the unprivileged user uid 100 / gid 101. Create the
# data directory with that owner before the first start (Linux):
#   mkdir -p data && sudo chown 100:101 data
services:
  lanpaper:
    image: ptabi/lanpaper:latest
    container_name: lanpaper
    restart: unless-stopped
    ports:
      # Change to "127.0.0.1:8080:8080" when only a local reverse proxy needs it.
      - "8080:8080"
    environment:
      PORT: "8080"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASS: "${ADMIN_PASS:?Set a strong ADMIN_PASS in your shell or private .env file}"
      MAX_UPLOAD_MB: "200"
      MAX_IMAGES: "100"
      MAX_CONCURRENT_UPLOADS: "2"
      COMPRESSION_QUALITY: "85"
      COMPRESSION_SCALE: "100"
      RATE_PUBLIC_PER_MIN: "120"
      RATE_UPLOAD_PER_MIN: "20"
      RATE_BURST: "10"
      # Version history: how many replaced files are kept per link, and the
      # disk budget shared by all of them. HISTORY_LIMIT=0 stores only the
      # live file, exactly like earlier versions.
      HISTORY_LIMIT: "3"
      HISTORY_MAX_MB: "512"
      # Extra files one link can serve from the same URL (?i=2, or rotation).
      PLAYLIST_MAX: "8"
      # Publishing from scripts without the admin login. Comma-separated,
      # 16+ characters each, and only for POST /api/upload and POST /api/link.
      # Keep it in .env, never in this file: generate one with
      #   openssl rand -hex 24
      # PUBLISH_KEYS: "${PUBLISH_KEYS}"
      # Let the listed sites read public media with JavaScript (comma-separated
      # origins, or * for any). Without it, cross-origin fetch and canvas fail.
      # CORS_ORIGINS: "https://dashboard.example.com,https://frame.example.com"
      # Let other sites frame public media (drops X-Frame-Options and the CSP
      # sandbox for /{name} only; /admin and /api/* stay unframable).
      # ALLOW_EMBED: "true"
      # Set only to the IP/CIDR of the reverse proxy; also configure it to
      # overwrite client-supplied X-Real-IP and X-Forwarded-* headers.
      # TRUSTED_PROXY: "172.18.0.1"
      # Terminate TLS in the container instead of at a proxy. Both must be set
      # (a half-configured certificate is a startup error), and the files have
      # to be mounted read-only; see docs/DEPLOYMENT.md.
      # TLS_CERT_FILE: "/app/certs/fullchain.pem"
      # TLS_KEY_FILE: "/app/certs/privkey.pem"
      # With external authentication and a network-restricted backend ONLY:
      # DISABLE_AUTH: "true"
      # EXTERNAL_IMAGE_DIR: "/app/gallery"
      # PROXY_TYPE: "socks5"
      # PROXY_HOST: "your-proxy-host"
      # PROXY_PORT: "1080"
    volumes:
      # Persist BOTH link metadata and all media; back up this whole directory.
      - ./data:/app/data
      # Only needed with TLS_CERT_FILE/TLS_KEY_FILE above:
      # - ./certs:/app/certs:ro
      # To browse a host gallery, uncomment this AND EXTERNAL_IMAGE_DIR above:
      # - ./external/images:/app/gallery:ro
    # Hardening: the service needs no Linux capabilities and never escalates.
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    # Lets in-flight uploads finish on "docker compose down" (the server
    # waits up to 30 s for active requests).
    stop_grace_period: 35s
