# Copy to docker-compose.yml. Set ADMIN_PASS in your shell or an untracked
# .env file before starting; the example must never deploy with a known password.
#
# The container runs as the unprivileged user uid 100 / gid 101. Create the
# data directory with that owner before the first start (Linux):
#   mkdir -p data && sudo chown 100:101 data
services:
  lanpaper:
    image: ptabi/lanpaper:latest
    container_name: lanpaper
    restart: unless-stopped
    ports:
      # Change to "127.0.0.1:8080:8080" when only a local reverse proxy needs it.
      - "8080:8080"
    environment:
      PORT: "8080"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASS: "${ADMIN_PASS:?Set a strong ADMIN_PASS in your shell or private .env file}"
      MAX_UPLOAD_MB: "200"
      MAX_IMAGES: "100"
      MAX_CONCURRENT_UPLOADS: "2"
      COMPRESSION_QUALITY: "85"
      COMPRESSION_SCALE: "100"
      RATE_PUBLIC_PER_MIN: "120"
      RATE_UPLOAD_PER_MIN: "20"
      RATE_BURST: "10"
      # Set only to the IP/CIDR of the reverse proxy; also configure it to
      # overwrite client-supplied X-Real-IP and X-Forwarded-* headers.
      # TRUSTED_PROXY: "172.18.0.1"
      # With external authentication and a network-restricted backend ONLY:
      # DISABLE_AUTH: "true"
      # EXTERNAL_IMAGE_DIR: "/app/gallery"
      # PROXY_TYPE: "socks5"
      # PROXY_HOST: "your-proxy-host"
      # PROXY_PORT: "1080"
    volumes:
      # Persist BOTH link metadata and all media; back up this whole directory.
      - ./data:/app/data
      # To browse a host gallery, uncomment this AND EXTERNAL_IMAGE_DIR above:
      # - ./external/images:/app/gallery:ro
    # Hardening: the service needs no Linux capabilities and never escalates.
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    # Lets in-flight uploads finish on "docker compose down" (the server
    # waits up to 30 s for active requests).
    stop_grace_period: 35s
