# SPDX-License-Identifier: MIT
name: CI/CD

on:
  push:
    branches: [ improvements, main ]
  pull_request:

# Least privilege: the workflow only reads the repository. Docker Hub
# credentials come from repository secrets and are used on main only.
permissions:
  contents: read
  # Requested only by the main-branch signing step; no registry credentials or
  # long-lived signing key are exposed to pull-request builds.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two supported Go releases; go.mod declares the minimum (1.26).
        go: [ oldstable, stable ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        run: |
          unformatted="$(find . -path ./vendor -prune -o -name '*.go' -print0 | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            while IFS= read -r file; do
              echo "::error file=${file}::File is not formatted; run gofmt -w ${file}"
            done <<< "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: |
          set +e
          output="$(go test -race -count=1 ./... 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            # Keep the failure visible through the Checks API even when a CI
            # log-storage host is unavailable to the person investigating it.
            diagnostic="$(printf '%s\n' "$output" | grep -E -C 4 -- '(^--- FAIL:|^FAIL[[:space:]]|panic:|WARNING: DATA RACE|_test\.go:[0-9]+:)' | tail -n 160)"
            if [ -z "$diagnostic" ]; then
              diagnostic="$(printf '%s\n' "$output" | tail -n 80)"
            fi
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error file=go.mod,line=1,title=Go tests failed::$diagnostic"
            exit "$status"
          fi

      - name: Build
        run: go build -trimpath -ldflags="-X main.Version=$(cat VERSION)" -o /dev/null .

      - name: Vulnerability check
        if: matrix.go == 'stable'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Syntax check
        run: for f in static/js/*.js static/sw.js; do node --input-type=module --check < "$f"; done

      - name: Unit tests
        run: node --test tests/*.test.cjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Build the server
        run: go build -o "$RUNNER_TEMP/lanpaper" .

      - name: Install browser tests
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Sign-in browser tests
        working-directory: tests/e2e
        env:
          LANPAPER_BIN: ${{ runner.temp }}/lanpaper
        run: |
          set +e
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/playwright.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail="$(sed -n '/^  1) /,$p' "$RUNNER_TEMP/playwright.log" | tail -160 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error file=tests/e2e::${detail}"
          fi
          exit "$status"

  docker:
    needs: [ test, frontend, e2e ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read version
        id: version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build once for amd64, load into the local Docker daemon for a smoke
      # test. Cache layers are stored in /tmp/.buildx-cache and reused below.
      - name: Build (amd64) & smoke-test
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VERSION="${VERSION}" \
            --build-arg GO_IMAGE=public.ecr.aws/docker/library/golang:1.27-alpine \
            --build-arg ALPINE_IMAGE=public.ecr.aws/docker/library/alpine:3.24 \
            --cache-to   type=local,dest=/tmp/.buildx-cache,mode=max \
            --cache-from type=local,src=/tmp/.buildx-cache \
            -t lanpaper:test --load .

          install -d -m 0700 /tmp/lp_test_data
          sudo chown 100:101 /tmp/lp_test_data
          docker run -d --name lp_test -p 8080:8080 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            --mount type=bind,source=/tmp/lp_test_data,destination=/app/data \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 \
            --memory 1g \
            --cpus 2.0 \
            lanpaper:test

          # Validate the documented Compose contract. The smoke container above
          # uses the same flags directly; Docker rejects unsupported isolation
          # options instead of silently weakening them.
          if ! compose_output="$(ADMIN_PASSWORD_HASH='$argon2id$v=19$m=65536,t=3,p=2$Y2ktc21va2U$Y2ktc21va2UtaGFzaA' \
            docker compose -f docker-compose-example.yml config --quiet 2>&1)"; then
            encoded="$(printf '%s' "$compose_output" | base64 -w0)"
            echo "::error::docker-compose-example.yml validation failed (base64 output): $encoded"
            exit 1
          fi

          # /health deliberately omits the version (it would tell a probe which
          # release to look up), so the version is checked on the image label.
          label="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' lanpaper:test)"
          if [ "$label" != "${VERSION}" ]; then
            echo "Image label version '${label}' does not match VERSION '${VERSION}'"
            exit 1
          fi

          echo "Waiting for container to be ready..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health | grep -q '"status":"ok"'; then
              echo "Container is healthy after $((i * 2))s"
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' lp_test)" != "true" ]; then
              logs="$(docker logs lp_test 2>&1)"
              encoded="$(printf '%s' "$logs" | base64 -w0)"
              echo "::error::Hardened container exited before readiness (base64 logs): $encoded"
              printf '### Hardened container logs\n```text\n%s\n```\n' "$logs" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if [ "$i" -eq 15 ]; then
              logs="$(docker logs lp_test 2>&1)"
              encoded="$(printf '%s' "$logs" | base64 -w0)"
              echo "::error::Hardened container did not become ready (base64 logs): $encoded"
              printf '### Hardened container logs\n```text\n%s\n```\n' "$logs" >> "$GITHUB_STEP_SUMMARY"
              docker rm -f lp_test
              exit 1
            fi
            sleep 2
          done
          # Without credentials the admin API must fail closed.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/wallpapers)" = "503"

          docker rm -f lp_test

      - name: Generate SPDX and CycloneDX SBOMs
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: lanpaper:test
          format: spdx-json
          output-file: lanpaper.spdx.json
          upload-artifact: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: lanpaper:test
          format: cyclonedx-json
          output-file: lanpaper.cyclonedx.json
          upload-artifact: false

      - name: Publish CI SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lanpaper-sbom
          path: |
            lanpaper.spdx.json
            lanpaper.cyclonedx.json
          if-no-files-found: error
          retention-days: 14

      # On main: rebuild for amd64+arm64 and push, reusing the cache from above.
      - name: Push signed release inputs to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release-image
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${VERSION}" \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file=/tmp/release-metadata.json \
            -t "ptabi/lanpaper:${VERSION}" \
            -t "ptabi/lanpaper:latest" \
            --push .
          digest="$(jq -r '."containerimage.digest"' /tmp/release-metadata.json)"
          test "$digest" != "null" && test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless-sign release image index
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.release-image.outputs.digest }}
        run: cosign sign --yes "ptabi/lanpaper@${DIGEST}"
