# SPDX-License-Identifier: MIT
name: CI/CD

on:
  push:
    branches: [ improvements, main ]
  pull_request:

# Least privilege: the workflow only reads the repository. Docker Hub
# credentials come from repository secrets and are used on main only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two supported Go releases; go.mod declares the minimum (1.26).
        go: [ oldstable, stable ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        run: |
          unformatted="$(find . -path ./vendor -prune -o -name '*.go' -print0 | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            while IFS= read -r file; do
              echo "::error file=${file}::File is not formatted; run gofmt -w ${file}"
            done <<< "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: |
          set +e
          output="$(go test -race -count=1 ./... 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            # Keep the failure visible through the Checks API even when a CI
            # log-storage host is unavailable to the person investigating it.
            diagnostic="$(printf '%s\n' "$output" | grep -E -C 4 -- '(^--- FAIL:|^FAIL[[:space:]]|panic:|WARNING: DATA RACE|_test\.go:[0-9]+:)' | tail -n 160)"
            if [ -z "$diagnostic" ]; then
              diagnostic="$(printf '%s\n' "$output" | tail -n 80)"
            fi
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error file=go.mod,line=1,title=Go tests failed::$diagnostic"
            exit "$status"
          fi

      - name: Build
        run: go build -trimpath -ldflags="-X main.Version=$(cat VERSION)" -o /dev/null .

      - name: Vulnerability check
        if: matrix.go == 'stable'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Syntax check
        run: for f in static/js/*.js static/sw.js; do node --input-type=module --check < "$f"; done

      - name: Unit tests
        run: node --test tests/*.test.cjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Build the server
        run: go build -o "$RUNNER_TEMP/lanpaper" .

      - name: Install browser tests
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Sign-in browser tests
        working-directory: tests/e2e
        env:
          LANPAPER_BIN: ${{ runner.temp }}/lanpaper
        run: |
          set +e
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/playwright.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail="$(sed -n '/^  1) /,$p' "$RUNNER_TEMP/playwright.log" | tail -160 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error file=tests/e2e::${detail}"
          fi
          exit "$status"

  docker:
    needs: [ test, frontend, e2e ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read version
        id: version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build once for amd64, load into the local Docker daemon for a smoke
      # test. Cache layers are stored in /tmp/.buildx-cache and reused below.
      - name: Build (amd64) & smoke-test
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VERSION="${VERSION}" \
            --build-arg GO_IMAGE=public.ecr.aws/docker/library/golang:1.27-alpine \
            --build-arg ALPINE_IMAGE=public.ecr.aws/docker/library/alpine:3.24 \
            --cache-to   type=local,dest=/tmp/.buildx-cache,mode=max \
            --cache-from type=local,src=/tmp/.buildx-cache \
            -t lanpaper:test --load .

          docker run -d --name lp_test -p 8080:8080 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            --tmpfs /app/data:rw,noexec,nosuid,size=256m,uid=100,gid=101,mode=0700 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 \
            --memory 512m \
            --cpus 1.0 \
            lanpaper:test

          # Validate both the documented Compose contract and the effective
          # runtime isolation used by this smoke test.
          ADMIN_PASSWORD_HASH='$argon2id$v=19$m=65536,t=3,p=2$Y2ktc21va2U$Y2ktc21va2UtaGFzaA' \
            docker compose -f docker-compose-example.yml config --quiet
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' lp_test)" = "true"
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' lp_test)" = "128"
          test "$(docker inspect --format '{{.HostConfig.SecurityOpt}}' lp_test)" = "[no-new-privileges:true]"
          test "$(docker inspect --format '{{json .HostConfig.CapDrop}}' lp_test)" = '["ALL"]'

          # /health deliberately omits the version (it would tell a probe which
          # release to look up), so the version is checked on the image label.
          label="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' lanpaper:test)"
          if [ "$label" != "${VERSION}" ]; then
            echo "Image label version '${label}' does not match VERSION '${VERSION}'"
            exit 1
          fi

          echo "Waiting for container to be ready..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health | grep -q '"status":"ok"'; then
              echo "Container is healthy after $((i * 2))s"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Container did not become healthy in time"
              docker logs lp_test
              docker rm -f lp_test
              exit 1
            fi
            sleep 2
          done
          # Without credentials the admin API must fail closed.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/wallpapers)" = "503"

          docker rm -f lp_test

      # On main: rebuild for amd64+arm64 and push, reusing the cache from above.
      - name: Push to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${VERSION}" \
            --cache-from type=local,src=/tmp/.buildx-cache \
            -t "ptabi/lanpaper:${VERSION}" \
            -t "ptabi/lanpaper:latest" \
            --push .
