<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Lanpaper · Sign in</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <img class="login-card__logo" src="/static/logo.svg" alt="" width="56" height="56">
    <h1 class="login-card__title">Lanpaper</h1>
    <form id="loginForm" class="login-card__form" novalidate>
      <label class="login-card__field">
        <span data-i18n="username">Username</span>
        <input name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      </label>
      <label class="login-card__field">
        <span data-i18n="password">Password</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="loginError" class="login-card__error" role="alert" hidden></p>
      <button id="loginSubmit" class="login-card__submit" type="submit" data-i18n="signIn">Sign in</button>
    </form>
  </main>
  <script src="/static/js/login.js" defer></script>
</body>
</html>
